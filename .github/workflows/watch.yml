name: EXPA applicant watcher

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Run briefly (60s) just to verify everything wires up, instead of the full ~6h loop"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: expa-watcher
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity for state commits
        run: |
          git config user.name "expa-watcher-bot"
          git config user.email "expa-watcher-bot@users.noreply.github.com"

      - name: Run poller
        env:
          EXPA_URL: ${{ secrets.EXPA_URL }}
          EXPA_METHOD: ${{ secrets.EXPA_METHOD }}
          EXPA_HEADERS_JSON: ${{ secrets.EXPA_HEADERS_JSON }}
          EXPA_BODY_JSON: ${{ secrets.EXPA_BODY_JSON }}
          EXPA_TOKEN_URL: ${{ secrets.EXPA_TOKEN_URL }}
          EXPA_CLIENT_ID: ${{ secrets.EXPA_CLIENT_ID }}
          EXPA_CLIENT_SECRET: ${{ secrets.EXPA_CLIENT_SECRET }}
          EXPA_REFRESH_TOKEN: ${{ secrets.EXPA_REFRESH_TOKEN }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLL_INTERVAL_SECONDS: "5"
          MAX_RUNTIME_SECONDS: ${{ github.event.inputs.test_mode == 'true' && '60' || '20700' }}
        run: python poller.py
